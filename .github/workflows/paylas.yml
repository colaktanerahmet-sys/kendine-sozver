# @kendine_sozver otomatik paylaşım. Saatler UTC; Türkiye = UTC+3.
name: paylas

on:
  schedule:
    # GitHub zamanlayıcısı gecikip bazı çalışmaları atlayabiliyor: 08:50–23:50 TR arası
    # saatte bir bakılır, vakti gelmiş ve bugün paylaşılmamış olan paylaşılır
    # (sabah 08:45, öğle 12:45, akşam 19:45 TR'den itibaren — ci_paylas.py VAKITLER).
    - cron: "50 5-20 * * *"
    - cron: "30 3 * * 1"   # Pazartesi 06:30 TR  anahtar yenileme + haftalık rapor
  workflow_dispatch:
    inputs:
      vakit:
        description: "Elle çalıştır"
        type: choice
        options: [oto, sabah, ogle, aksam, karusel, yorum, rapor, yenile]
        default: oto
      dene:
        description: "Sadece dene (Instagram videoyu işler ama YAYINLAMAZ)"
        type: boolean
        default: false

permissions:
  contents: write
  issues: write

concurrency:
  group: paylas
  cancel-in-progress: false

jobs:
  calis:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - run: pip install requests

      - name: Vakti belirle
        id: v
        run: |
          case "${{ github.event.schedule }}" in
            "50 5-20 * * *")    v=oto ;;
            "30 3 * * 1")       v=yenile ;;
            *)            v="${{ inputs.vakit }}" ;;
          esac
          echo "vakit=$v" >> "$GITHUB_OUTPUT"

      - name: Anahtarı çöz
        env:
          ENC_KEY: ${{ secrets.ENC_KEY }}
        run: |
          T=$(openssl enc -d -aes-256-cbc -pbkdf2 -pass env:ENC_KEY -in durum/token.enc)
          echo "::add-mask::$T"
          echo "IG_ACCESS_TOKEN=$T" >> "$GITHUB_ENV"

      - name: Paylaş
        env:
          ENC_KEY: ${{ secrets.ENC_KEY }}
          IG_USER_ID: ${{ vars.IG_USER_ID }}
          GH_TOKEN: ${{ github.token }}
          NOTION_TOKEN: ${{ secrets.NOTION_TOKEN }}
          NOTION_PAGE_ID: ${{ vars.NOTION_PAGE_ID }}
        run: python ci_paylas.py "${{ steps.v.outputs.vakit }}" ${{ inputs.dene && '--dene' || '' }}

      - name: Durumu kaydet
        if: always()
        run: |
          git config user.name "kendine-sozver-bot"
          git config user.email "bot@users.noreply.github.com"
          git add durum
          git diff --cached --quiet && exit 0
          git commit -m "durum: ${{ steps.v.outputs.vakit }} $(date -u +%F)"
          git pull --rebase -q && git push
